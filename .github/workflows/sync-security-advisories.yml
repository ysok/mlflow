name: Sync Security Advisories

# Mirrors open repository security advisories into a private org Project as
# draft items. Advisory data is confidential, so every step that touches it
# discards stdout/stderr: workflow logs are public on this repo.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  sync:
    if: github.repository == 'mlflow/mlflow'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mlflow
          repositories: mlflow
          permission-repository-advisories: read
          permission-organization-projects: write

      - name: Sync advisories to project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          PROJECT_NUMBER: 12
        run: |
          exec >/dev/null 2>&1
          cd "$RUNNER_TEMP"

          project_id=$(gh api graphql \
            -f query='query($org: String!, $n: Int!) { organization(login: $org) { projectV2(number: $n) { id } } }' \
            -f org="$ORG" -F n="$PROJECT_NUMBER" \
            --jq '.data.organization.projectV2.id')

          # Draft item title is the GHSA ID, which keys the upsert.
          gh api graphql --paginate \
            -f query='query($id: ID!, $endCursor: String) {
              node(id: $id) { ... on ProjectV2 {
                items(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { content { ... on DraftIssue { id title } } }
                }
              } }
            }' \
            -f id="$project_id" \
            --jq '.data.node.items.nodes[].content | select(.id) | "\(.title)\t\(.id)"' > existing.tsv

          gh api "repos/$REPO/security-advisories?per_page=100" --paginate \
            --jq '.[] | select(.state == "triage" or .state == "draft") | @base64' > advisories.txt

          while IFS= read -r row; do
            advisory=$(base64 -d <<< "$row")
            ghsa=$(jq -r '.ghsa_id' <<< "$advisory")
            body=$(jq -r '[
              "**\(.summary)**",
              "",
              "- State: \(.state)",
              "- Severity: \(.severity // "unset")",
              "- Created: \(.created_at)",
              "- Updated: \(.updated_at)",
              "- Comments: \(.comments // 0)",
              "- \(.html_url)"
            ] | join("\n")' <<< "$advisory")
            draft_id=$(awk -F '\t' -v t="$ghsa" '$1 == t { print $2; exit }' existing.tsv)
            if [ -n "$draft_id" ]; then
              gh api graphql \
                -f query='mutation($id: ID!, $body: String!) { updateProjectV2DraftIssue(input: { draftIssueId: $id, body: $body }) { draftIssue { id } } }' \
                -f id="$draft_id" -f body="$body"
            else
              gh api graphql \
                -f query='mutation($project: ID!, $title: String!, $body: String!) { addProjectV2DraftIssue(input: { projectId: $project, title: $title, body: $body }) { projectItem { id } } }' \
                -f project="$project_id" -f title="$ghsa" -f body="$body"
            fi
          done < advisories.txt
